name: actweave

on:
  push:
    branches:
      - main
    paths:
      - "concepts/actweave/**"
      - ".github/workflows/actweave.yml"
  pull_request:
    paths:
      - "concepts/actweave/**"
      - ".github/workflows/actweave.yml"

defaults:
  run:
    working-directory: concepts/actweave

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20.x"
          - "22.x"
          - "24.x"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: concepts/actweave/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Format
        if: matrix.node-version == '22.x'
        run: npm run format:check

      - name: Coverage
        if: matrix.node-version == '22.x'
        run: npm run test:coverage

      - name: Package check
        if: matrix.node-version == '22.x'
        run: npm run pack:check

      - name: Example (keyless end-to-end)
        if: matrix.node-version == '22.x'
        run: |
          npm run build
          cd examples/refund-agent
          npm install
          npm test

  # Non-blocking early warning: do the integration tests still pass against
  # the newest ai release? (The verify job pins an exact version.)
  ai-canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: concepts/actweave/package-lock.json

      - name: Install
        run: npm ci

      - name: Upgrade ai to latest
        run: npm install --no-save ai@latest

      - name: Integration tests against ai@latest
        run: npx vitest run test/integration
